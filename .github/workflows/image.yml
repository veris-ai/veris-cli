# Publish the runner image to GHCR.
#
# This is the image `veris run --image` starts beside the code under
# test, and it is pulled by whoever is testing — a laptop, someone else's CI —
# never by our cluster. That is the whole reason it lives here and is public:
# a client should be able to run the proxy without a Google account, without
# `gcloud auth configure-docker`, and without an account with us at all.
#
# It used to be published from veris-ai/services-sandbox into a private
# Artifact Registry repository, which meant every client authenticated to GCP
# before their first run. Anonymous pull could not be granted there: the
# organization enforces constraints/iam.allowedPolicyMemberDomains against a
# single customer id, so `allUsers` on any resource in it is refused, and the
# narrowest exception available is an entire project. GHCR needs no exception,
# no new vendor, and no credential beyond GITHUB_TOKEN.
#
# Published from THIS repository because this is where the proxy is developed,
# tested and released. services-sandbox pins a commit; it does not own the
# artifact.
name: image

on:
  push:
    branches: [main]
    paths:
      - "container/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/image.yml"
    tags: ["v*"]
  # Called by release.yml once it has cut a tag. A tag pushed with
  # GITHUB_TOKEN raises no events, by design, so the tags: trigger above
  # never fires for an automated release and the release calls this instead.
  # The trigger stays for a tag a person pushes by hand.
  workflow_call:
    inputs:
      version:
        description: The release tag to build and label the image with.
        type: string
        required: true
  workflow_dispatch:

concurrency:
  # A release must not be cancelled by the main-branch build that follows it,
  # so the two do not share a group.
  group: image-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ inputs.version == '' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag when released, so the image is built from exactly what
          # the binaries were built from rather than from whatever main
          # moved to while the release ran.
          ref: ${{ inputs.version || github.ref }}

      # BOTH architectures, unlike an image that runs on a cluster we choose.
      # This one runs on a developer's laptop, and an amd64-only image on
      # Apple Silicon does not fail at the workload — it fails installing
      # iptables inside the proxy ("Failed to initialize nft: Protocol not
      # supported"), because emulation does not carry the netfilter syscalls.
      # That reads as a broken proxy rather than as a missing architecture.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `runner` is the tag the CLI reaches for by default, so it moves on
      # every publish or clients keep pulling an old proxy. The sha tag is
      # what you pin to when bisecting one; the version tags only exist for
      # a release.
      - name: Tags
        id: tags
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          TAGS="$IMAGE:runner,$IMAGE:${SHA::12}"
          RELEASE="${{ inputs.version }}"
          if [ -z "$RELEASE" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE="${GITHUB_REF_NAME}"
          fi
          if [ -n "$RELEASE" ]; then
            TAGS="$TAGS,$IMAGE:${RELEASE},$IMAGE:latest"
            VERSION="$RELEASE"
          else
            VERSION="${SHA::12}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'
            echo '```'
            echo "Anonymous pull: \`docker pull $IMAGE:runner\`"
          } >> "$GITHUB_STEP_SUMMARY"
