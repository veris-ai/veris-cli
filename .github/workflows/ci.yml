name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test -race ./...
      # The Go tests use Go's TLS stack, which is more forgiving than most.
      # The e2e run proves the chain is accepted by OpenSSL, Python and Node.
      - run: make e2e

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make dist
      - run: file dist/veris-linux-amd64 | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with: { name: binaries, path: dist/ }
